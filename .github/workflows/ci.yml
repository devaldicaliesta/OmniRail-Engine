name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dataset:
    name: Dataset uji PII
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test unit pemeriksa dataset
        run: python -m unittest discover -s eval/tools -v

      - name: Periksa konsistensi dataset dan eval/README.md
        run: |
          python eval/tools/cek_dataset.py --ringkasan | tee ringkasan.txt
          {
            echo '### Dataset uji PII'
            sed -n '/^## Ringkasan dataset/,$p' ringkasan.txt | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"
